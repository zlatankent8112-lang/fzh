[pytest]
minversion = 7.0
python_files = test_*.py
# Ensure imports like 'new_structure.extensions' work by adding parent directory
pythonpath =
	.
	..
addopts = -q
markers =
	nodb: test does not require database/app fixtures (skips autouse db/session setup)
	freshapp: test requires a fresh per-test Flask app (use fresh_app/fresh_client fixtures)
	integration: integration test (tests complete flows)
	staging: test requires staging credentials and hits real APIs
	slow: test takes more than 5 seconds to complete
	manual: test requires manual intervention (phone interaction, etc.)
filterwarnings =
    ignore:'flask.Markup' is deprecated:DeprecationWarning:flask_wtf.*
    ignore:the load_module\(\) method is deprecated:DeprecationWarning:importlib._bootstrap
